name: CI

# Runs on every push and pull request: tests the backend, builds the frontend,
# checks the shell scripts and builds the three lab Docker images.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  scripts:
    name: Shell script check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check every .sh file
        run: |
          find . -name '*.sh' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 bash -n
          echo "all scripts parse"

  images:
    name: Lab images build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lab: [python, java, web, datascience]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.lab }} image
        run: docker build -t cloudlab/${{ matrix.lab }}:ci -f infra/images/${{ matrix.lab }}/Dockerfile .
