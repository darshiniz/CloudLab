# /etc/nginx/sites-available/cloudlab  (Azure control VM). HTTP only; `certbot --nginx` adds HTTPS to this file.
# The upstream group "cloudlab_api" lives in /etc/nginx/conf.d/cloudlab-upstream.conf (written by lb.sh).
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name YOUR-DNS-NAME.centralindia.cloudapp.azure.com;

    client_max_body_size 210m;            # dataset uploads (the API enforces the real limits)

    root /var/www/cloudlab;               # React build (frontend/dist)
    index index.html;
    location / { try_files $uri /index.html; }

    location /api/ {
        proxy_pass http://cloudlab_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Lab IDEs (HTTP + WebSocket); the API authenticates and forwards to the right worker
    location /lab/ {
        proxy_pass http://cloudlab_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
