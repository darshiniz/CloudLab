# /etc/nginx/sites-available/cloudlab   (control VM). TLS certificates: sudo certbot --nginx -d cloudlab.example.edu
server {
    listen 80;
    server_name cloudlab.example.edu;
    return 301 https://$host$request_uri;
}

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 443 ssl http2;
    server_name cloudlab.example.edu;
    ssl_certificate     /etc/letsencrypt/live/cloudlab.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloudlab.example.edu/privkey.pem;

    client_max_body_size 210m;            # dataset uploads (API enforces the real limits)

    # React build (npm run build -> /var/www/cloudlab)
    root /var/www/cloudlab;
    index index.html;
    location / { try_files $uri /index.html; }

    # REST API
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Lab IDEs (HTTP + WebSocket). The API authenticates and forwards to the right worker.
    location /lab/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
